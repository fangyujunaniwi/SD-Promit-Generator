        <polyline points="21 15 16 10 5 21"/>

<script>
// ==================== [MODIFIED] 修改点 1: 移除旧的本地管理员哈希系统，改用 Supabase Auth ====================
// 旧的 ADMIN_HASH_STORAGE 和 sha256 函数已删除

const ENV_CONFIG_STORAGE = 'sd_env_config';

// ==================== [MODIFIED] 修改点 2: 全局状态新增用户认证相关变量 ====================
let supabaseClient = null;
let currentUser = null;
let isAdmin = false;
let isReadOnly = true; // 默认只读，直到确认是管理员

// [MODIFIED] 新增：Vaptcha 人机验证相关状态
let vaptchaVid = '';
let vaptchaObj = null;
const appBasePath = (location.pathname === '/sd' || location.pathname.startsWith('/sd/')) ? '/sd' : '';
let captchaApiPath = appBasePath + '/api/captcha';
let vaptchaScriptLoading = false;
window.captchaToken = '';
window.vaptchaVerify = null;

// ==================== [MODIFIED] 新增：Vaptcha V4 SDK 动态加载 ====================
function loadVaptchaScript(cb) {
  if (typeof vaptcha !== 'undefined') { if (cb) cb(); return; }
  if (vaptchaScriptLoading) return;
  vaptchaScriptLoading = true;
  const urls = [
    'https://c4.vaptcha.com/src/v4.js'
  ];
  let idx = 0;
  function tryNext() {
    if (idx >= urls.length) {
      vaptchaScriptLoading = false;
      if (cb) cb();
      return;
    }
    const s = document.createElement('script');
    s.src = urls[idx++];
    s.async = true;
    s.onload = function() { vaptchaScriptLoading = false; if (cb) cb(); };
    s.onerror = function() { s.remove(); tryNext(); };
    document.head.appendChild(s);
  }
  tryNext();
}

// ==================== [MODIFIED] 新增：Vaptcha V4 渲染与令牌管理 ====================
function renderVaptchaButton(wrapper) {
  wrapper.innerHTML = '';
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.textContent = window.captchaToken ? '✓ 已完成验证' : '点击进行人机验证';
  btn.className = 'btn btn-primary';
  btn.style.width = '100%';
  btn.onclick = async function() {
    try {
      const result = await vaptchaObj.validate();
      if (result && result.token && result.knock) {
        window.vaptchaVerify = result;
        window.captchaToken = result.token;
        btn.textContent = '✓ 已完成验证';
      }
    } catch (e) {
      console.error('Vaptcha validate error:', e);
    }
  };
  wrapper.appendChild(btn);
}

function renderCaptcha() {
  const wrapper = document.getElementById('captcha-widget');
  if (!wrapper) return;
  window.captchaToken = '';
  window.vaptchaVerify = null;
  if (!vaptchaVid) {
    wrapper.innerHTML = '<div style="font-size:12px;color:#999;padding:14px 0;">人机验证未配置，无法登录/注册</div>';
    return;
  }
  if (typeof vaptcha === 'undefined') {
    wrapper.innerHTML = '<div style="font-size:12px;color:#999;padding:14px 0;">人机验证加载中...</div>';
    loadVaptchaScript(function() {
      if (document.getElementById('auth-modal').style.display !== 'none') renderCaptcha();
    });
    return;
  }
  if (vaptchaObj) {
    renderVaptchaButton(wrapper);
    return;
  }
  wrapper.innerHTML = '';
  try {
    const anchor = document.createElement('div');
    wrapper.appendChild(anchor);
    vaptcha({
      vid: vaptchaVid,
      container: anchor,
      lang: 'zh-CN'
    }).then(function(obj) {
      vaptchaObj = obj;
      renderVaptchaButton(wrapper);
    }).catch(function(e) {
      console.error('Vaptcha init error:', e);
      wrapper.innerHTML = '<div style="font-size:12px;color:#dc3545;padding:14px 0;">人机验证加载失败</div>';
    });
  } catch (e) {
    console.error('Vaptcha render error:', e);
    wrapper.innerHTML = '<div style="font-size:12px;color:#dc3545;padding:14px 0;">人机验证加载失败</div>';
  }
}

function resetCaptcha() {
  window.captchaToken = '';
  window.vaptchaVerify = null;
  const wrapper = document.getElementById('captcha-widget');
  if (wrapper && vaptchaObj) renderVaptchaButton(wrapper);
}

// ==================== [MODIFIED] 新增：Vaptcha V4 服务端二次校验 ====================
async function verifyVaptcha(verify) {
  if (!verify || !verify.token) return { ok: false, msg: '未获取到验证结果，请重新验证' };
  try {
    const controller = new AbortController();
    const timer = setTimeout(function() { controller.abort(); }, 8000);
    const resp = await fetch(captchaApiPath, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: verify.token, knock: verify.knock || '', dfu: verify.dfu || '', ip: verify.ip || '' }),
      signal: controller.signal,
      cache: 'no-store'
    });
    clearTimeout(timer);
    if (!resp.ok) return { ok: false, msg: '校验服务异常(' + resp.status + ')' };
    const data = await resp.json();
    if (data.ok === true) return { ok: true, msg: '' };
    return { ok: false, msg: data.msg || '校验失败' };
  } catch (e) {
    return { ok: false, msg: '无法连接校验服务' };
  }
}

function saveEnvConfig() {
  const url = document.getElementById('env-sb-url').value.trim();
  const key = document.getElementById('env-sb-key').value.trim();
  if (!url && !key) {
    showToast('请输入至少一项配置');
    return;
  }
  const config = { url: url, key: key, savedAt: new Date().toISOString() };
  localStorage.setItem(ENV_CONFIG_STORAGE, JSON.stringify(config));
  showToast('环境变量配置已保存');
}

function loadEnvConfig() {
  try {
    const saved = localStorage.getItem(ENV_CONFIG_STORAGE);
    if (saved) {
      const config = JSON.parse(saved);
      document.getElementById('env-sb-url').value = config.url || '';
      document.getElementById('env-sb-key').value = config.key || '';
      showToast('已加载保存的配置');
    } else {
      showToast('没有已保存的配置');
    }
  } catch (e) {
    showToast('加载配置失败');
  }
}

function clearEnvConfig() {
  localStorage.removeItem(ENV_CONFIG_STORAGE);
  document.getElementById('env-sb-url').value = '';
  document.getElementById('env-sb-key').value = '';
  showToast('配置已清除');
}

// ==================== [MODIFIED] 新增：从 Serverless 平台自动读取环境变量 ====================
async function autoLoadEnvConfig() {
  const endpoints = [appBasePath + '/api/config', appBasePath + '/.netlify/functions/config'];
  for (let i = 0; i < endpoints.length; i++) {
    try {
      const controller = new AbortController();
      const timer = setTimeout(function() { controller.abort(); }, 5000);
      const resp = await fetch(endpoints[i] + '?t=' + Date.now(), { signal: controller.signal, cache: 'no-store' });
      clearTimeout(timer);
      if (!resp.ok) continue;
      const data = await resp.json();
      const url = data.SUPABASE_URL || data.url || data.supabaseUrl || '';
      const key = data.SUPABASE_ANON_KEY || data.key || data.anonKey || '';
      const vid = data.VAPTCHA_VID || data.vaptchaVid || data.vid || '';
      if (vid) vaptchaVid = vid;
      if (url && key) {
        captchaApiPath = endpoints[i].indexOf('/.netlify/functions/config') >= 0 ? appBasePath + '/.netlify/functions/captcha' : appBasePath + '/api/captcha';
        document.getElementById('env-sb-url').value = url;
        document.getElementById('env-sb-key').value = key;
        localStorage.setItem(ENV_CONFIG_STORAGE, JSON.stringify({ url: url, key: key, source: 'server-env', savedAt: new Date().toISOString() }));
        updateSyncStatus('syncing', '自动连接中...');
        await connectSupabase();
        if (document.getElementById('auth-modal').style.display !== 'none') renderCaptcha();
        return;
      }
    } catch (e) {
      // 继续尝试下一个端点
    }
  }
  loadEnvConfig();
}

// ==================== [MODIFIED] 修改点 3: 连接 Supabase 时初始化认证状态监听 ====================
async function connectSupabase() {
  let url = document.getElementById('env-sb-url').value.trim();
  let key = document.getElementById('env-sb-key').value.trim();

  if (!url || !key) {
    try {
      const saved = localStorage.getItem(ENV_CONFIG_STORAGE);
      if (saved) {
        const cfg = JSON.parse(saved);
        url = cfg.url || '';
        key = cfg.key || '';
      }
    } catch (e) {}
  }

  if (!url || !key) {
    showToast('未找到 Supabase 配置，请先通过环境变量或本地配置提供');
    return;
  }

  updateSyncStatus('syncing', '连接中...');

  try {
    supabaseClient = supabase.createClient(url, key, {
      auth: {
        autoRefreshToken: true,
        persistSession: true,
        detectSessionInUrl: true
      }
    });

    // 监听认证状态变化
    supabaseClient.auth.onAuthStateChange(function(event, session) {
      if (event === 'SIGNED_IN' || event === 'TOKEN_REFRESHED') {
        currentUser = session.user;
        checkAdminStatus();
      } else if (event === 'SIGNED_OUT') {
        currentUser = null;
        isAdmin = false;
        isReadOnly = true;
        updateUserUI();
        updateAdminVisibility();
      }
    });

    // 获取当前会话
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (session) {
      currentUser = session.user;
      await checkAdminStatus();
    } else {
      updateUserUI();
    }

    // 尝试读取数据验证连接（不依赖 id 列类型）
    const { data, error } = await supabaseClient
      .from('sd_data')
      .select('data')
      .limit(1)
      .maybeSingle();

    if (error && error.code !== 'PGRST116') {
      if (error.code === '42P01') {
        throw new Error('表 sd_data 不存在，请先创建表');
      }
      throw error;
    }

    if (data && data.data) {
      const cloudData = typeof data.data === 'string' ? JSON.parse(data.data) : data.data;
      if (cloudData.categories && cloudData.tags) {
        categories = cloudData.categories;
        tags = cloudData.tags;
        categories.forEach(function(c) { if (typeof c.hidden === 'undefined') c.hidden = false; });
        selectedTags.clear();
        activeCategoryId = getVisibleCategories()[0] ? getVisibleCategories()[0].id : (categories[0] ? categories[0].id : '');
        saveToLocalStorage();
        renderAll(); updateStats(); updateHiddenToggleVisibility();
        updateSyncStatus('synced', '服务器连接成功');
        showToast('服务器连接成功，数据已同步');
      } else {
        await saveToSupabase();
        updateSyncStatus('synced', '服务器连接成功');
        showToast('服务器连接成功，数据已上传');
      }
    } else {
      await saveToSupabase();
      updateSyncStatus('synced', '服务器连接成功');
      showToast('服务器连接成功，已创建云端数据');
    }

    updateAdminVisibility();

  } catch (err) {
    updateSyncStatus('error', '连接失败');
    showToast('Supabase 连接失败: ' + err.message);
    console.error('Supabase connection error:', err);
  }
}

// ==================== [MODIFIED] 修改点 4: 新增检查管理员状态函数 ====================
async function checkAdminStatus() {
  if (!supabaseClient || !currentUser) {
    isAdmin = false;
    isReadOnly = true;
    updateUserUI();
    updateAdminVisibility();
    return;
  }

  try {
    const { data, error } = await supabaseClient
      .from('admins')
      .select('user_id')
      .eq('user_id', currentUser.id)
      .single();

    if (error && error.code !== 'PGRST116') {
      console.error('Admin check error:', error);
      isAdmin = false;
    } else {
      isAdmin = !!data;
    }
  } catch (e) {
    isAdmin = false;
  }

  isReadOnly = !isAdmin;
  updateUserUI();
  updateAdminVisibility();
}

// ==================== [MODIFIED] 修改点 7: 新增认证模态框相关函数（含 Vaptcha） ====================
function openAuthModal() {
  document.getElementById('auth-modal').style.display = 'flex';
  document.getElementById('auth-error').textContent = '';
  renderCaptcha();
}

function closeAuthModal() {
  document.getElementById('auth-modal').style.display = 'none';
  document.getElementById('auth-error').textContent = '';
}

function switchAuthTab(tab) {
  document.querySelectorAll('.auth-tab').forEach(function(t) { t.classList.remove('active'); });
  document.getElementById('auth-tab-' + tab).classList.add('active');
  document.getElementById('auth-form-login').style.display = tab === 'login' ? 'flex' : 'none';
  document.getElementById('auth-form-register').style.display = tab === 'register' ? 'flex' : 'none';
  document.getElementById('auth-error').textContent = '';
  resetCaptcha();
}

async function handleLogin() {
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  const errorEl = document.getElementById('auth-error');

  if (!email || !password) {
    errorEl.textContent = '请输入邮箱和密码';
    return;
  }

  if (!supabaseClient) {
    errorEl.textContent = '请先连接 Supabase';
    return;
  }

  if (!window.captchaToken || !window.vaptchaVerify) {
    errorEl.textContent = '请先完成人机验证';
    return;
  }

  const human = await verifyVaptcha(window.vaptchaVerify);
  if (!human.ok) {
    resetCaptcha();
    errorEl.textContent = '人机验证校验失败: ' + (human.msg || '请重试');
    return;
  }

  try {
    const { data, error } = await supabaseClient.auth.signInWithPassword({
      email: email,
      password: password
    });

    if (error) throw error;

    currentUser = data.user;
    await checkAdminStatus();
    closeAuthModal();
    showToast('登录成功');
    if (currentView === 'admin') {
      renderAdmin(); updateStats();
    }
  } catch (err) {
    resetCaptcha();
    errorEl.textContent = '登录失败: ' + err.message;
  }
}

async function handleRegister() {
  const email = document.getElementById('register-email').value.trim();
  const password = document.getElementById('register-password').value;
  const confirm = document.getElementById('register-password-confirm').value;
  const errorEl = document.getElementById('auth-error');

  if (!email || !password) {
    errorEl.textContent = '请输入邮箱和密码';
    return;
  }
  if (password.length < 6) {
    errorEl.textContent = '密码至少6位';
    return;
  }
  if (password !== confirm) {
    errorEl.textContent = '两次输入的密码不一致';
    return;
  }
  if (!supabaseClient) {
    errorEl.textContent = '请先连接 Supabase';
    return;
  }

  if (!window.captchaToken || !window.vaptchaVerify) {
    errorEl.textContent = '请先完成人机验证';
    return;
  }

  const human = await verifyVaptcha(window.vaptchaVerify);
  if (!human.ok) {
    resetCaptcha();
    errorEl.textContent = '人机验证校验失败: ' + (human.msg || '请重试');
    return;
  }

  try {
    const { data, error } = await supabaseClient.auth.signUp({
      email: email,
      password: password
    });

    if (error) throw error;

    currentUser = data.user;
    isAdmin = false;
    isReadOnly = true;
    updateUserUI();
    updateAdminVisibility();
    closeAuthModal();
    showToast('注册成功，请检查邮箱验证（如启用）');
  } catch (err) {
    resetCaptcha();
    errorEl.textContent = '注册失败: ' + err.message;
  }
}

async function logout() {
  if (!supabaseClient) return;
  try {
    await supabaseClient.auth.signOut();
    currentUser = null;
    isAdmin = false;
    isReadOnly = true;
    updateUserUI();
    updateAdminVisibility();
    showToast('已退出登录');
  } catch (err) {
    showToast('退出失败: ' + err.message);
  }
}

// ==================== [MODIFIED] 新增：建议提交与管理员查看 ====================
async function submitSuggestion() {
  const title = document.getElementById('suggest-title').value.trim();
  const content = document.getElementById('suggest-content').value.trim();
  if (!content) { showToast('请输入建议内容'); return; }
  if (!supabaseClient) { showToast('请先连接 Supabase'); return; }
  try {
    const { error } = await supabaseClient.from('suggestions').insert({
      title: title || null,
      content: content,
      email: currentUser ? currentUser.email : null,
      created_at: new Date().toISOString()
    });
    if (error) throw error;
    document.getElementById('suggest-title').value = '';
    document.getElementById('suggest-content').value = '';
    document.getElementById('suggest-result').innerHTML = '<div class="dup-empty">建议已提交，感谢你的反馈！</div>';
    showToast('建议已提交');
  } catch (e) {
    showToast('提交失败: ' + e.message);
  }
}

async function loadSuggestions() {
  const listEl = document.getElementById('suggest-list');
  const countEl = document.getElementById('suggest-count');
  if (!listEl) return;
  if (!supabaseClient) { listEl.textContent = '尚未连接 Supabase'; return; }
  listEl.textContent = '加载中...';
  try {
    const { data, error } = await supabaseClient
      .from('suggestions')
      .select('id, title, content, email, created_at')
      .order('created_at', { ascending: false })
      .limit(100);
    if (error) throw error;
    if (countEl) countEl.textContent = data ? data.length : 0;
    if (!data || data.length === 0) {
      listEl.innerHTML = '<div class="dup-empty">暂无建议</div>';
      return;
    }
    listEl.innerHTML = data.map(function(s) {
      const time = new Date(s.created_at).toLocaleString();
      return '<div class="suggest-item"><div class="suggest-item-header">' +
        '<span class="suggest-item-title">' + escapeHtml(s.title || '（无标题）') + '</span>' +
        '<button class="icon-btn delete" title="删除建议" onclick="deleteSuggestion(\'' + s.id + '\')">X</button></div>' +
        '<div class="suggest-item-content">' + escapeHtml(s.content) + '</div>' +
        '<div class="suggest-item-meta"><span>' + escapeHtml(s.email || '匿名') + '</span><span>' + time + '</span></div></div>';
    }).join('');
  } catch (e) {
    listEl.innerHTML = '<div style="color:#dc3545;font-size:13px;">加载失败：' + escapeHtml(e.message) + '</div>';
  }
}

async function deleteSuggestion(id) {
  if (!requireAdmin()) return;
  if (!id) return;
  if (!confirm('确定删除这条建议？')) return;
  try {
    const { error } = await supabaseClient.from('suggestions').delete().eq('id', id);
    if (error) throw error;
    showToast('建议已删除');
    loadSuggestions();
  } catch (e) {
    showToast('删除失败: ' + e.message);
  }
}

// ==================== [MODIFIED] 修改点 9: 重写 saveData 函数，增加权限检查 ====================
function saveData() {
  saveToLocalStorage();
  if (supabaseClient) {
    if (isReadOnly) {
      showToast('只读模式：数据仅保存到本地，未同步到云端');
      return false;
    }
    saveToSupabase();
  }
  return true;
}

// ==================== [MODIFIED] 修改点 10: 重写 requireAdmin 函数，使用 Supabase 认证 ====================
function requireAdmin() {
  if (!supabaseClient) {
    showToast('请先连接 Supabase');
    return false;
  }
  if (isReadOnly) {
    showToast('只读模式：您没有编辑权限，请联系管理员');
    return false;
  }
  if (!currentUser) {
    showToast('请先登录管理员账号');
    openAuthModal();
    return false;
  }
  return true;
}

async function saveToSupabase() {
  if (!supabaseClient) return;
  updateSyncStatus('syncing', '同步中...');
  try {
    const data = { categories: categories, tags: tags, savedAt: new Date().toISOString() };
    const payload = { data: data };
    const existing = await supabaseClient.from('sd_data').select('id').limit(1).maybeSingle();
    let error = existing.error && existing.error.code !== 'PGRST116' ? existing.error : null;
    if (!error) {
      if (existing.data && existing.data.id != null) {
        error = (await supabaseClient.from('sd_data').update(payload).eq('id', existing.data.id)).error;
      } else {
        let ins = await supabaseClient.from('sd_data').insert(payload);
        if (ins.error && (ins.error.code === '23502' || ins.error.code === '22P02' || /syntax|not-null|invalid input/i.test(ins.error.message || ''))) {
          ins = await supabaseClient.from('sd_data').insert(Object.assign({ id: 1 }, payload));
        }
        error = ins.error;
      }
    }

    if (error) {
      console.error('sd_data save error:', error.code, error.message, error.details);
      if (error.code === '42501') {
        showToast('权限不足：您不是管理员，无法写入云端');
        isReadOnly = true;
        updateAdminVisibility();
      } else {
        showToast('同步失败: ' + error.message);
      }
      updateSyncStatus('error', '同步失败');
    } else {
      updateSyncStatus('synced', '已同步');
    }
  } catch (e) {
    console.error('Supabase save error', e);
    updateSyncStatus('error', '同步失败');
  }
}

// ==================== [MODIFIED] 修改点 11: 重写 resetToDefault 函数 ====================
function resetToDefault() {
  if (!requireAdmin()) return;
  if (!confirm('确定重置为默认数据？所有自定义的分类和标签将被清除。')) return;
  categories = JSON.parse(JSON.stringify(DEFAULT_DATA.categories));
  tags = JSON.parse(JSON.stringify(DEFAULT_DATA.tags));
  selectedTags.clear();
  activeCategoryId = categories[0] ? categories[0].id : '';
  saveData();
  renderAll(); updateStats(); showToast('已重置为默认数据');
}

    showToast('仅管理员可访问后台管理');
    tab = 'suggest';
  }
  if (tab === 'suggest' && !currentUser) {
    showToast('请先登录后再提交建议');
    tab = 'generator';
  }

  currentView = tab;
  const mobileBar = document.getElementById('mobile-bar');
  if (mobileBar) mobileBar.style.display = (tab === 'generator') ? '' : 'none';
  document.querySelectorAll('.nav-tab').forEach(function(t) { t.classList.remove('active'); });
  document.querySelector('[data-tab="' + tab + '"]').classList.add('active');
  document.getElementById('generator-view').style.display = 'none';
  document.getElementById('suggest-view').style.display = 'none';
  document.getElementById('admin-view').style.display = 'none';
  if (tab === 'generator') {
    document.getElementById('generator-view').style.display = 'flex';
    renderSidebar(); renderTags(); renderSelectedTags();
  } else if (tab === 'suggest') {
    document.getElementById('suggest-view').style.display = 'block';
  } else {
    document.getElementById('admin-view').style.display = 'block';
    updateAdminVisibility();
    renderAdmin(); updateStats(); loadSuggestions();
  }
}

  '#3b82f6', '#ef4444', '#22c55e', '#a855f7', '#f59e0b',

  '#1d4ed8', '#047857', '#7c3aed', '#c2410c', '#be185d'
];
let selectedColor = COLORS[0];

let categories = [], tags = [], selectedTags = new Map();
let activeCategoryId = '', currentView = 'generator';
let duplicateCache = null, showHiddenCategories = false;
let globalSearchQuery = '', sidebarSearchQuery = '';

const DATA_STORAGE_KEY = 'sd_prompt_data';
const DATA_VERSION = 2;

function loadData() {
  try {
    const saved = localStorage.getItem(DATA_STORAGE_KEY);
    if (saved) {
      const data = JSON.parse(saved);
      if (data.categories && Array.isArray(data.categories) && data.categories.length > 0) {
        categories = data.categories;
        tags = data.tags || [];
        categories.forEach(function(c) { if (typeof c.hidden === 'undefined') c.hidden = false; });
        activeCategoryId = categories[0] ? categories[0].id : '';
        return;
      }
    }
  } catch (e) { console.error('load from localStorage failed', e); }
  categories = JSON.parse(JSON.stringify(DEFAULT_DATA.categories));
  tags = JSON.parse(JSON.stringify(DEFAULT_DATA.tags));
  activeCategoryId = categories[0] ? categories[0].id : '';
  saveToLocalStorage();
}

function saveToLocalStorage() {
  try {
    const data = { version: DATA_VERSION, categories: categories, tags: tags, savedAt: new Date().toISOString() };
    localStorage.setItem(DATA_STORAGE_KEY, JSON.stringify(data));
  } catch (e) {
    console.error('save to localStorage failed', e);
    showToast('本地保存失败，可能是存储空间不足');
  }
}

function exportData() {
  const exportCategories = categories.map(function(c) {
    return { id: c.id, name: c.name, color: c.color, hidden: !!c.hidden };
  });
  const data = { version: DATA_VERSION, categories: exportCategories, tags: tags, exportTime: new Date().toISOString() };
  const json = JSON.stringify(data, null, 2);
  const dataUri = 'data:application/json;charset=utf-8,' + encodeURIComponent(json);
  const a = document.createElement('a');
  a.href = dataUri;
  a.download = 'sd-prompt-data-' + Date.now() + '.json';
  a.style.display = 'none';
  document.body.appendChild(a);
  try { a.click(); showToast('数据已导出'); }
  catch (e) { window.open(dataUri, '_blank'); showToast('数据已导出（新窗口打开）'); }
  setTimeout(function() { if (a.parentNode) document.body.removeChild(a); }, 100);
}

function importData(input) {
  if (!requireAdmin()) return;
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = JSON.parse(e.target.result);
      if (!data.categories || !Array.isArray(data.categories)) { showToast('文件格式错误'); return; }
      categories = data.categories; tags = data.tags || [];
      categories.forEach(function(c) { if (typeof c.hidden === 'undefined') c.hidden = false; });
      selectedTags.clear();
      activeCategoryId = getVisibleCategories()[0] ? getVisibleCategories()[0].id : (categories[0] ? categories[0].id : '');
      saveData(); renderAll(); updateStats();
      showToast('成功导入 ' + categories.length + ' 个分类，' + tags.length + ' 个标签');
    } catch (err) { showToast('导入失败：' + err.message); }
  };
  reader.readAsText(file); input.value = '';
}

function init() {
  loadData(); renderColorPicker(); renderAll(); updateStats(); updateHiddenToggleVisibility();
  autoLoadEnvConfig();
}
function renderAll() { renderSidebar(); renderTags(); renderSelectedTags(); updatePrompt(); renderAdmin(); }

function updateStats() {
  document.getElementById('stat-cats').textContent = categories.length;
  document.getElementById('stat-tags').textContent = tags.length;
  const dups = findDuplicates();
  document.getElementById('stat-dups').textContent = dups.totalDupCount;
}

function findDuplicates() {
  const nameMap = new Map(), dupGroups = [];
  let totalDupCount = 0;
  tags.forEach(function(tag) {
    const key = normalizeTagName(tag.name);
    if (!nameMap.has(key)) nameMap.set(key, []);
    nameMap.get(key).push(tag);
  });
  nameMap.forEach(function(group, key) {
    if (group.length > 1) { dupGroups.push({ key: key, tags: group, count: group.length }); totalDupCount += group.length; }
  });
  return { dupGroups: dupGroups, totalDupCount: totalDupCount };
}
function normalizeTagName(name) { return name.toLowerCase().trim().replace(/\s+/g, ' '); }

function runDuplicateCheck() {
  if (!requireAdmin()) return;
  const result = findDuplicates();
  duplicateCache = result;
  const container = document.getElementById('dup-results');
  if (result.dupGroups.length === 0) { container.innerHTML = '<div class="dup-empty">未发现重复标签，数据很干净！</div>'; updateStats(); return; }
  let html = '<div class="dup-panel"><div class="dup-panel-title">发现 ' + result.dupGroups.length + ' 组重复，共 ' + result.totalDupCount + ' 个标签</div>';
  result.dupGroups.forEach(function(group) {
    html += '<div class="dup-group"><div class="dup-group-header">"' + group.key + '" — ' + group.count + ' 个重复</div>';
    group.tags.forEach(function(tag) {
      const cat = categories.find(function(c) { return c.id === tag.catId; });
      html += '<div class="dup-item"><span>' + tag.name + (tag.cn ? ' (' + tag.cn + ')' : '') + '</span><span class="dup-cat" style="background:' + (cat ? cat.color + '20' : '#eee') + ';color:' + (cat ? cat.color : '#666') + '">' + (cat ? cat.name : '未分类') + '</span></div>';
    });
    html += '</div>';
  });
  html += '<div class="btn-group" style="margin-top:12px;"><button class="btn" onclick="mergeDuplicates(\'first\')">合并（保留上面）</button><button class="btn" onclick="mergeDuplicates(\'last\')">合并（保留下面）</button></div>';
  html += '</div>'; container.innerHTML = html; updateStats();
}

function mergeDuplicates(mode) {
  if (!requireAdmin()) return;
  const result = findDuplicates();
  if (result.dupGroups.length === 0) { showToast('没有重复标签需要合并'); return; }
  const keepLast = mode === 'last';
  let merged = 0;
  result.dupGroups.forEach(function(group) {
    const keepIdx = keepLast ? group.tags.length - 1 : 0;
    const removeIds = group.tags.filter(function(t, i) { return i !== keepIdx; }).map(function(t) { return t.id; });
    removeIds.forEach(function(id) { if (selectedTags.has(id)) selectedTags.delete(id); });
    tags = tags.filter(function(t) { return !removeIds.includes(t.id); });
    merged += removeIds.length;
  });
  saveData(); renderAll(); updateStats();
  document.getElementById('dup-results').innerHTML = '<div class="dup-empty">重复标签已自动合并' + (keepLast ? '（保留下面）' : '（保留上面）') + '</div>';
  showToast('已合并 ' + merged + ' 个重复标签' + (keepLast ? '（保留下面）' : '（保留上面）'));
}

function getVisibleCategories() {
  if (showHiddenCategories) return categories;
  return categories.filter(function(c) { return !c.hidden; });
}
function hasHiddenCategories() { return categories.some(function(c) { return c.hidden; }); }

function updateHiddenToggleVisibility() {
  const wrapper = document.getElementById('show-hidden-toggle-wrapper');
  if (hasHiddenCategories()) { wrapper.style.display = 'flex'; }
  else { wrapper.style.display = 'none'; showHiddenCategories = false; document.getElementById('show-hidden-toggle').classList.remove('on'); }
}

function toggleShowHidden() {
  showHiddenCategories = !showHiddenCategories;
  document.getElementById('show-hidden-toggle').classList.toggle('on', showHiddenCategories);
  const visible = getVisibleCategories();
  const currentCat = categories.find(function(c) { return c.id === activeCategoryId; });
  if (currentCat && currentCat.hidden && !showHiddenCategories) activeCategoryId = visible[0] ? visible[0].id : '';
  renderSidebar(); renderTags();
}

function renderSidebar() {
  const container = document.getElementById('category-list-container');
  let visibleCats = getVisibleCategories();
  const query = sidebarSearchQuery;
  if (query) {
    visibleCats = visibleCats.filter(function(cat) {
      return cat.name.toLowerCase().includes(query);
    });
  }
  if (visibleCats.length === 0) { 
    container.innerHTML = '<div class="empty-state">' + (query ? '未找到匹配的分类' : '暂无分类') + '</div>'; 
    return; 
  }
  container.innerHTML = visibleCats.map(function(cat) {
    const count = tags.filter(function(t) { return t.catId === cat.id; }).length;
    const isHidden = cat.hidden;
    let nameHtml = cat.name;
    if (query) {
      const idx = cat.name.toLowerCase().indexOf(query);
      if (idx >= 0) {
        nameHtml = cat.name.substring(0, idx) + '<mark style="background:#f59e0b33;color:#1a1a1a;border-radius:2px;padding:0 2px;">' + cat.name.substring(idx, idx + query.length) + '</mark>' + cat.name.substring(idx + query.length);
      }
    }
    return '<div class="category-item ' + (cat.id === activeCategoryId ? 'active' : '') + ' ' + (isHidden ? 'hidden-cat' : '') + '" onclick="selectCategory(\'' + cat.id + '\')"><span>' + nameHtml + (isHidden ? '<span class="hidden-badge">隐</span>' : '') + '</span><span class="category-count">' + count + '</span></div>';
  }).join('');
}

function renderTags() {
  const area = document.getElementById('tag-area');
  if (globalSearchQuery.trim()) { renderSearchResults(area); return; }
  const cat = categories.find(function(c) { return c.id === activeCategoryId; });
  if (!cat) { area.innerHTML = '<div class="empty-state">请选择一个分类</div>'; return; }
  const catTags = tags.filter(function(t) { return t.catId === activeCategoryId; });
  let html = '<div class="tag-section-title"><span class="color-dot" style="background:' + cat.color + '"></span>' + cat.name + '<span style="font-size:13px;font-weight:400;color:#999;">(' + catTags.length + ' 个标签)</span></div>';
  html += '<div class="tags-grid">';
  catTags.forEach(function(tag) {
    const isSelected = selectedTags.has(tag.id);
    const weight = selectedTags.get(tag.id) || 1.0;
    const displayName = tag.cn ? tag.name + ' (' + tag.cn + ')' : tag.name;
    html += '<div class="tag-chip ' + (isSelected ? 'selected' : '') + '" data-tag-id="' + tag.id + '" onclick="toggleTag(\'' + tag.id + '\')" oncontextmenu="handleTagContextMenu(event, this);return false;">' + displayName + (isSelected ? '<span class="weight-badge">' + weight.toFixed(1) + '</span>' : '') + '</div>';
  });
  html += '</div>'; area.innerHTML = html;
}

function renderSearchResults(area) {
  const query = globalSearchQuery.toLowerCase().trim();
  if (!query) { renderTags(); return; }
  const results = tags.filter(function(t) {
    const matched = t.name.toLowerCase().includes(query) || (t.cn && t.cn.toLowerCase().includes(query));
    if (!matched) return false;
    if (showHiddenCategories) return true;
    const cat = categories.find(function(c) { return c.id === t.catId; });
    return !(cat && cat.hidden);
  });
  if (results.length === 0) { area.innerHTML = '<div class="empty-state">未找到包含 "' + escapeHtml(globalSearchQuery) + '" 的标签</div>'; return; }
  const grouped = {};
  results.forEach(function(tag) {
    const cat = categories.find(function(c) { return c.id === tag.catId; });
    const catName = cat ? cat.name : '未分类';
    const catColor = cat ? cat.color : '#999';
    const catId = cat ? cat.id : 'unknown';
    if (!grouped[catId]) grouped[catId] = { catName: catName, catColor: catColor, tags: [] };
    grouped[catId].tags.push(tag);
  });
  let html = '<div class="search-results-title">搜索 "' + escapeHtml(globalSearchQuery) + '" — 找到 ' + results.length + ' 个结果</div>';
  Object.entries(grouped).forEach(function(entry) {
    const catId = entry[0], group = entry[1];
    html += '<div class="search-result-group">';
    html += '<div class="search-result-group-header"><span class="color-dot" style="background:' + group.catColor + '"></span><span class="cat-name">' + group.catName + '</span><span class="cat-count">' + group.tags.length + ' 个</span></div>';
    html += '<div class="tags-grid">';
    group.tags.forEach(function(tag) {
      const isSelected = selectedTags.has(tag.id);
      const weight = selectedTags.get(tag.id) || 1.0;
      const displayName = tag.cn ? tag.name + ' (' + tag.cn + ')' : tag.name;
      html += '<div class="tag-chip ' + (isSelected ? 'selected' : '') + '" data-tag-id="' + tag.id + '" onclick="toggleTag(\'' + tag.id + '\')" oncontextmenu="handleTagContextMenu(event, this);return false;" title="分类: ' + group.catName + '">' + displayName + (isSelected ? '<span class="weight-badge">' + weight.toFixed(1) + '</span>' : '') + '</div>';
    });
    html += '</div></div>';
  });
  area.innerHTML = html;
}

function handleTagContextMenu(event, element) {
  event.preventDefault();
  const tagId = element.getAttribute('data-tag-id');
  if (!tagId) return;
  adjustWeight(event, tagId);
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function onGlobalSearch(value) {
  globalSearchQuery = value;
  sidebarSearchQuery = value.toLowerCase().trim();
  renderSidebar();
  renderTags();
}

function clearGlobalSearch() {
  document.getElementById('global-search').value = '';
  globalSearchQuery = '';
  sidebarSearchQuery = '';
  renderSidebar();
  renderTags();
}

function renderSelectedTags() {
  const container = document.getElementById('selected-tags-list');
  if (selectedTags.size === 0) {
    container.innerHTML = '<span style="color:#ccc;font-size:13px;">未选择任何标签</span>';
  } else {
    container.innerHTML = Array.from(selectedTags.entries()).map(function(entry) {
      const tagId = entry[0], weight = entry[1];
      const tag = tags.find(function(t) { return t.id === tagId; });
      if (!tag) return '';
      const display = tag.cn ? tag.name + ' (' + tag.cn + ')' : tag.name;
      return '<div class="selected-tag-item" onclick="toggleTag(\'' + tag.id + '\')" title="点击移除">' + display + (weight !== 1.0 ? '<span style="font-family:monospace;">:' + weight.toFixed(1) + '</span>' : '') + '<span style="font-size:10px;opacity:0.6;">&#x2715;</span></div>';
    }).join('');
  }
  updateMobileBar();
  syncPromptSheet();
}

function updateMobileBar() {
  const bar = document.getElementById('mobile-bar');
  if (!bar) return;
  const countEl = document.getElementById('mobile-count');
  if (countEl) countEl.textContent = '已选 ' + selectedTags.size + ' 个';
}

function openPromptSheet() {
  let sheet = document.getElementById('prompt-sheet');
  if (!sheet) {
    sheet = document.createElement('div');
    sheet.className = 'modal-overlay';
    sheet.id = 'prompt-sheet';
    sheet.innerHTML = '<div class="modal-content"><div class="modal-title">提示词</div>' +
      '<textarea class="prompt-box" id="prompt-sheet-text" readonly style="min-height:120px;width:100%;"></textarea>' +
      '<div class="panel-title" style="margin-top:12px;">已选标签</div>' +
      '<div class="selected-tags-list" id="prompt-sheet-tags"></div>' +
      '<div class="btn-group" style="margin-top:12px;"><button class="btn btn-primary" id="prompt-sheet-copy">复制</button><button class="btn" id="prompt-sheet-clear">清空</button><button class="btn" id="prompt-sheet-close">关闭</button></div></div>';
    document.body.appendChild(sheet);
    sheet.addEventListener('click', function(e) { if (e.target === sheet) closePromptSheet(); });
    document.getElementById('prompt-sheet-copy').addEventListener('click', copyPrompt);
    document.getElementById('prompt-sheet-clear').addEventListener('click', function() { clearAll(); });
    document.getElementById('prompt-sheet-close').addEventListener('click', closePromptSheet);
  }
  sheet.style.display = 'flex';
  syncPromptSheet();
}

function closePromptSheet() {
  const sheet = document.getElementById('prompt-sheet');
  if (sheet) sheet.style.display = 'none';
}

function syncPromptSheet() {
  const sheet = document.getElementById('prompt-sheet');
  if (!sheet || sheet.style.display === 'none') return;
  const textEl = document.getElementById('prompt-sheet-text');
  const textArea = document.getElementById('prompt-text');
  if (textEl && textArea) textEl.value = textArea.value;
  const tagsEl = document.getElementById('prompt-sheet-tags');
  if (!tagsEl) return;
  if (selectedTags.size === 0) {
    tagsEl.innerHTML = '<span style="color:#ccc;font-size:13px;">未选择任何标签</span>';
    return;
  }
  tagsEl.innerHTML = Array.from(selectedTags.entries()).map(function(entry) {
    const tag = tags.find(function(t) { return t.id === entry[0]; });
    if (!tag) return '';
    return '<span class="selected-tag-item" style="cursor:default;">' + escapeHtml(tag.name) + (entry[1] !== 1.0 ? ' :' + entry[1].toFixed(1) : '') + '</span>';
  }).join('');
}

function renderColorPicker() {
  const picker = document.getElementById('color-picker');
  picker.innerHTML = COLORS.map(function(c) {
    return '<div class="color-option ' + (c === selectedColor ? 'selected' : '') + '" style="background:' + c + '" onclick="selectColor(\'' + c + '\')"></div>';
  }).join('');
}

function renderAdmin() {
  const catList = document.getElementById('category-list');
  catList.innerHTML = categories.map(function(cat) {
    const count = tags.filter(function(t) { return t.catId === cat.id; }).length;
    const hiddenText = cat.hidden ? ' <span style="font-size:11px;color:#f59e0b;">[已隐藏]</span>' : '';
    return '<div class="category-card"><div class="category-card-info"><div class="category-color" style="background:' + cat.color + '" onclick="changeCategoryColor(\'' + cat.id + '\')" title="点击修改颜色"></div><div><div class="category-card-name">' + cat.name + hiddenText + '</div><div class="category-card-count">' + count + ' 个标签</div></div></div><div class="category-card-actions"><button class="icon-btn" data-crud onclick="toggleCategoryHidden(\'' + cat.id + '\')" title="' + (cat.hidden ? '显示' : '隐藏') + '分类">H</button><button class="icon-btn" data-crud onclick="editCategory(\'' + cat.id + '\')" title="编辑">E</button><button class="icon-btn delete" data-crud onclick="deleteCategory(\'' + cat.id + '\')" title="删除">X</button></div></div>';
  }).join('');

  const select = document.getElementById('batch-cat-select');
  select.innerHTML = categories.map(function(cat) { return '<option value="' + cat.id + '">' + cat.name + '</option>'; }).join('');

  const mergeSource = document.getElementById('merge-source-select');
  const mergeTarget = document.getElementById('merge-target-select');
  if (mergeSource && mergeTarget) {
    const options = categories.map(function(cat) { return '<option value="' + cat.id + '">' + cat.name + '</option>'; }).join('');
    mergeSource.innerHTML = options; mergeTarget.innerHTML = options;
  }

  const tagFilterCat = document.getElementById('tag-filter-cat');
  if (tagFilterCat) {
    const currentFilter = tagFilterCat.value;
    let filterHtml = '<option value="">全部分类</option>';
    categories.forEach(function(cat) {
      filterHtml += '<option value="' + cat.id + '">' + cat.name + '</option>';
    });
    tagFilterCat.innerHTML = filterHtml;
    tagFilterCat.value = currentFilter;
  }

  renderTagTable();
}

function renderTagTable() {
  const tbody = document.getElementById('tag-table-body');
  const searchEl = document.getElementById('tag-search');
  const search = searchEl ? (searchEl.value || '').toLowerCase() : '';
  const catFilterEl = document.getElementById('tag-filter-cat');
  const catFilter = catFilterEl ? catFilterEl.value : '';

  let filtered = tags;
  if (search) filtered = filtered.filter(function(t) { return t.name.toLowerCase().includes(search) || (t.cn && t.cn.toLowerCase().includes(search)); });
  if (catFilter) filtered = filtered.filter(function(t) { return t.catId === catFilter; });

  if (filtered.length === 0) {
    tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;color:#999;padding:40px 20px;">' + (search ? '未找到包含 "' + escapeHtml(searchEl.value) + '" 的标签' : '该分类下暂无标签') + '</td></tr>';
    return;
  }

  tbody.innerHTML = filtered.map(function(tag) {
    const cat = categories.find(function(c) { return c.id === tag.catId; });
    return '<tr><td class="tag-name-cell">' + tag.name + (tag.cn ? ' <span style="color:#999;font-size:12px;">(' + tag.cn + ')</span>' : '') + '</td><td class="tag-cat-cell">' + (cat ? cat.name : '未分类') + '</td><td><div class="weight-slider"><input type="range" min="0.1" max="2.0" step="0.1" value="' + tag.weight + '" onchange="updateTagWeight(\'' + tag.id + '\', this.value)" data-crud><span class="weight-value">' + tag.weight.toFixed(1) + '</span></div></td><td><div style="display:flex;gap:6px;align-items:center;"><button class="icon-btn" data-crud onclick="editTag(\'' + tag.id + '\')" title="编辑">E</button><button class="icon-btn" data-crud onclick="moveTag(\'' + tag.id + '\')" title="移动分类">M</button><button class="icon-btn delete" data-crud onclick="deleteTag(\'' + tag.id + '\')" title="删除">X</button></div></td></tr>';
  }).join('');
}

function selectCategory(catId) {
  activeCategoryId = catId;
  globalSearchQuery = '';
  document.getElementById('global-search').value = '';
  renderSidebar(); renderTags();
}

function toggleTag(tagId) {
  if (selectedTags.has(tagId)) { selectedTags.delete(tagId); }
  else { const tag = tags.find(function(t) { return t.id === tagId; }); selectedTags.set(tagId, tag ? tag.weight : 1.0); }
  renderTags(); renderSelectedTags(); updatePrompt();
}

function adjustWeight(event, tagId) {
  event.preventDefault();
  if (!selectedTags.has(tagId)) return;
  let w = selectedTags.get(tagId);
  if (event.shiftKey) {
    w = Math.max(0.1, w - 0.1);
  } else {
    w = Math.min(2.0, w + 0.1);
  }
  selectedTags.set(tagId, w);
  renderTags(); renderSelectedTags(); updatePrompt();
}

function addWeightToAll(delta) {
  selectedTags.forEach(function(w, id) {
    let newW = Math.max(0.1, Math.min(2.0, w + delta));
    selectedTags.set(id, newW);
    const tag = tags.find(function(t) { return t.id === id; });
    if (tag) tag.weight = newW;
  });
  saveData(); renderTags(); renderSelectedTags(); updatePrompt();
}

function updatePrompt() {
  const parts = [];
  selectedTags.forEach(function(weight, tagId) {
    const tag = tags.find(function(t) { return t.id === tagId; });
    if (!tag) return;
    if (weight === 1.0) parts.push(tag.name);
    else parts.push('(' + tag.name + ':' + weight.toFixed(1) + ')');
  });
  document.getElementById('prompt-text').value = parts.join(', ');
  syncPromptSheet();
}

function clearAll() {
  selectedTags.clear(); renderTags(); renderSelectedTags(); updatePrompt();
  showToast('已清空所有标签');
}

async function copyPrompt() {
  const text = document.getElementById('prompt-text').value;
  if (!text) { showToast('提示词为空'); return; }
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(text);
      showToast('已复制到剪贴板');
    } else {
      const ta = document.createElement('textarea');
      ta.value = text; document.body.appendChild(ta);
      ta.select(); document.execCommand('copy');
      document.body.removeChild(ta); showToast('已复制到剪贴板');
    }
  } catch(e) { showToast('复制失败，请手动复制'); }
}

function selectColor(color) { selectedColor = color; renderColorPicker(); }

function addCategory() {
  if (!requireAdmin()) return;
  const name = document.getElementById('new-cat-name').value.trim();
  if (!name) { showToast('请输入分类名称'); return; }
  const id = 'cat_' + Date.now();
  categories.push({ id: id, name: name, color: selectedColor, hidden: false });
  document.getElementById('new-cat-name').value = '';
  saveData(); renderAdmin(); updateStats(); updateHiddenToggleVisibility();
  showToast('分类「' + name + '」已添加');
}

function deleteCategory(catId) {
  if (!requireAdmin()) return;
  if (!confirm('确定删除此分类？该分类下的所有标签也将被删除。')) return;
  categories = categories.filter(function(c) { return c.id !== catId; });
  tags = tags.filter(function(t) { return t.catId !== catId; });
  selectedTags.forEach(function(_, id) { if (!tags.find(function(t) { return t.id === id; })) selectedTags.delete(id); });
  if (activeCategoryId === catId) activeCategoryId = categories[0] ? categories[0].id : '';
  saveData(); renderAll(); updateStats(); updateHiddenToggleVisibility();
  showToast('分类已删除');
}

function editCategory(catId) {
  if (!requireAdmin()) return;
  const cat = categories.find(function(c) { return c.id === catId; });
  if (!cat) return;
  const newName = prompt('修改分类名称：', cat.name);
  if (newName && newName.trim()) { cat.name = newName.trim(); saveData(); renderAdmin(); renderSidebar(); showToast('分类已更新'); }
}

function changeCategoryColor(catId) {
  if (!requireAdmin()) return;
  const cat = categories.find(function(c) { return c.id === catId; });
  if (!cat) return;
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'color-modal';
  overlay.addEventListener('click', function(e) {
    if (e.target === overlay) closeColorModal();
  });
  let colorHtml = '';
  COLORS.forEach(function(c) {
    colorHtml += '<div class="color-option ' + (c === cat.color ? 'selected' : '') + '" style="background:' + c + ';width:32px;height:32px;" data-color="' + c + '"></div>';
  });
  overlay.innerHTML = '<div class="modal-content"><div class="modal-title">修改「' + cat.name + '」的颜色</div><div class="modal-body"><div class="color-picker-row" style="gap:8px;">' + colorHtml + '</div></div><div class="modal-footer"><button class="btn" id="color-modal-cancel">取消</button></div></div>';
  document.body.appendChild(overlay);
  overlay.querySelectorAll('.color-option').forEach(function(el) {
    el.addEventListener('click', function() {
      applyCategoryColor(catId, el.getAttribute('data-color'));
    });
  });
  const cancelBtn = document.getElementById('color-modal-cancel');
  if (cancelBtn) cancelBtn.addEventListener('click', closeColorModal);
}

function applyCategoryColor(catId, color) {
  if (!requireAdmin()) return;
  const cat = categories.find(function(c) { return c.id === catId; });
  if (cat) { cat.color = color; saveData(); renderAll(); closeColorModal(); showToast('颜色已更新'); }
}
function closeColorModal() { const modal = document.getElementById('color-modal'); if (modal) modal.remove(); }

function toggleCategoryHidden(catId) {
  if (!requireAdmin()) return;
  const cat = categories.find(function(c) { return c.id === catId; });
  if (!cat) return;
  cat.hidden = !cat.hidden;
  saveData(); renderAdmin(); renderSidebar(); updateHiddenToggleVisibility();
  showToast(cat.hidden ? '分类已隐藏' : '分类已显示');
}

function mergeCategories() {
  if (!requireAdmin()) return;
  const sourceId = document.getElementById('merge-source-select').value;
  const targetId = document.getElementById('merge-target-select').value;
  if (!sourceId || !targetId) { showToast('请选择源分类和目标分类'); return; }
  if (sourceId === targetId) { showToast('源分类和目标分类不能相同'); return; }
  const sourceCat = categories.find(function(c) { return c.id === sourceId; });
  const targetCat = categories.find(function(c) { return c.id === targetId; });
  if (!sourceCat || !targetCat) { showToast('分类不存在'); return; }
  const movedCount = tags.filter(function(t) { return t.catId === sourceId; }).length;
  if (!confirm('确定将「' + sourceCat.name + '」的 ' + movedCount + ' 个标签合并到「' + targetCat.name + '」？\n源分类将被删除。')) return;
  tags.forEach(function(t) { if (t.catId === sourceId) t.catId = targetId; });
  categories = categories.filter(function(c) { return c.id !== sourceId; });
  if (activeCategoryId === sourceId) activeCategoryId = targetId;
  saveData(); renderAll(); updateStats(); updateHiddenToggleVisibility();
  showToast('已将 ' + movedCount + ' 个标签从「' + sourceCat.name + '」合并到「' + targetCat.name + '」');
}

function generateTagId() {
  return 't_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9) + '_' + Math.random().toString(36).substr(2, 5);
}

function batchAddTags() {
  if (!requireAdmin()) return;
  const catId = document.getElementById('batch-cat-select').value;
  const text = document.getElementById('batch-tags').value.trim();
  const skipDup = document.getElementById('skip-dup-check').checked;
  if (!text) { showToast('请输入标签内容'); return; }
  const lines = text.split('\n').map(function(l) { return l.trim(); }).filter(function(l) { return l; });
  let added = 0, skipped = 0;
  lines.forEach(function(line) {
    const match = line.match(/^([a-zA-Z0-9_\-\s\(\):.,]+?)(?:\s+([^\u0000-\u007F][^]*))?$/);
    if (match) {
      const name = match[1].trim();
      const cn = match[2] ? match[2].trim() : '';
      if (name) {
        const exists = tags.some(function(t) { return normalizeTagName(t.name) === normalizeTagName(name); });
        if (exists) { skipped++; if (skipDup) return; }
        tags.push({ id: generateTagId(), catId: catId, name: name, cn: cn, weight: 1.0 });
        added++;
      }
    }
  });
  document.getElementById('batch-tags').value = '';
  saveData(); renderAdmin(); renderSidebar(); renderTags(); updateStats();
  if (skipped > 0) showToast('添加 ' + added + ' 个，跳过 ' + skipped + ' 个重复标签');
  else showToast('成功添加 ' + added + ' 个标签');
}

function deleteTag(tagId) {
  if (!requireAdmin()) return;
  if (!confirm('确定删除此标签？')) return;
  tags = tags.filter(function(t) { return t.id !== tagId; });
  selectedTags.delete(tagId);
  saveData(); renderAdmin(); renderSidebar(); renderTags(); renderSelectedTags(); updatePrompt(); updateStats();
}

function editTag(tagId) {
  if (!requireAdmin()) return;
  const tag = tags.find(function(t) { return t.id === tagId; });
  if (!tag) return;
  const catOptions = categories.map(function(c) {
    return '<option value="' + c.id + '"' + (c.id === tag.catId ? ' selected' : '') + '>' + escapeHtml(c.name) + '</option>';
  }).join('');
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'edit-tag-modal';
  overlay.addEventListener('click', function(e) { if (e.target === overlay) closeEditTagModal(); });
  overlay.innerHTML = '<div class="modal-content"><div class="modal-title">编辑标签</div>' +
    '<div class="modal-body">' +
    '<div class="form-row"><label style="min-width:70px;">标签</label><input type="text" class="form-input" id="edit-tag-name" value="' + escapeHtml(tag.name) + '"></div>' +
    '<div class="form-row"><label style="min-width:70px;">中文说明</label><input type="text" class="form-input" id="edit-tag-cn" value="' + escapeHtml(tag.cn || '') + '"></div>' +
    '<div class="form-row"><label style="min-width:70px;">分类</label><select class="form-select" id="edit-tag-cat" style="min-width:160px;">' + catOptions + '</select></div>' +
    '<div class="form-row"><label style="min-width:70px;">权重</label><input type="number" class="form-input" id="edit-tag-weight" step="0.1" min="0.1" max="2.0" value="' + tag.weight + '"></div>' +
    '</div>' +
    '<div class="modal-footer"><button class="btn" id="edit-tag-cancel">取消</button><button class="btn btn-primary" id="edit-tag-save">保存</button></div></div>';
  document.body.appendChild(overlay);
  document.getElementById('edit-tag-cancel').addEventListener('click', closeEditTagModal);
  document.getElementById('edit-tag-save').addEventListener('click', function() { saveEditTag(tagId); });
}

function closeEditTagModal() { const modal = document.getElementById('edit-tag-modal'); if (modal) modal.remove(); }

function moveTag(tagId) {
  if (!requireAdmin()) return;
  const tag = tags.find(function(t) { return t.id === tagId; });
  if (!tag) return;
  const catOptions = categories.map(function(c) {
    return '<option value="' + c.id + '"' + (c.id === tag.catId ? ' selected' : '') + '>' + escapeHtml(c.name) + '</option>';
  }).join('');
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'move-tag-modal';
  overlay.addEventListener('click', function(e) { if (e.target === overlay) overlay.remove(); });
  overlay.innerHTML = '<div class="modal-content"><div class="modal-title">移动标签到分类</div>' +
    '<div class="modal-body">' +
    '<div style="font-size:13px;color:#666;margin-bottom:12px;">' + escapeHtml(tag.name) + (tag.cn ? ' (' + escapeHtml(tag.cn) + ')' : '') + '</div>' +
    '<div class="form-row"><label style="min-width:70px;">目标分类</label><select class="form-select" id="move-tag-cat" style="min-width:160px;">' + catOptions + '</select></div>' +
    '</div>' +
    '<div class="modal-footer"><button class="btn" id="move-tag-cancel">取消</button><button class="btn btn-primary" id="move-tag-save">保存</button></div></div>';
  document.body.appendChild(overlay);
  document.getElementById('move-tag-cancel').addEventListener('click', function() { overlay.remove(); });
  document.getElementById('move-tag-save').addEventListener('click', function() {
    if (!requireAdmin()) return;
    const targetId = document.getElementById('move-tag-cat').value;
    if (!targetId) { showToast('请选择分类'); return; }
    tag.catId = targetId;
    saveData(); renderAdmin(); renderSidebar(); renderTags(); renderSelectedTags(); updatePrompt(); updateStats();
    overlay.remove();
    const targetCat = categories.find(function(c) { return c.id === targetId; });
    showToast('标签已移动到「' + (targetCat ? targetCat.name : '未分类') + '」');
  });
}

function saveEditTag(tagId) {
  if (!requireAdmin()) return;
  const tag = tags.find(function(t) { return t.id === tagId; });
  if (!tag) return;
  const name = document.getElementById('edit-tag-name').value.trim();
  const cn = document.getElementById('edit-tag-cn').value.trim();
  const catId = document.getElementById('edit-tag-cat').value;
  const weight = parseFloat(document.getElementById('edit-tag-weight').value);
  if (!name) { showToast('标签不能为空'); return; }
  const exists = tags.some(function(t) { return t.id !== tagId && normalizeTagName(t.name) === normalizeTagName(name); });
  if (exists) { showToast('已存在同名标签'); return; }
  tag.name = name;
  tag.cn = cn;
  tag.catId = catId;
  if (!isNaN(weight) && weight >= 0.1 && weight <= 2.0) tag.weight = weight;
  saveData(); renderAdmin(); renderSidebar(); renderTags(); renderSelectedTags(); updatePrompt(); updateStats();
  closeEditTagModal();
  showToast('标签已更新');
}

function updateTagWeight(tagId, weight) {
  if (!requireAdmin()) return;
  const tag = tags.find(function(t) { return t.id === tagId; });
  if (tag) {
    tag.weight = parseFloat(weight); saveData();
    if (selectedTags.has(tagId)) { selectedTags.set(tagId, tag.weight); updatePrompt(); renderSelectedTags(); }
  }
  const activeEl = document.activeElement;
  if (activeEl && activeEl.type === 'range') {
    const valueSpan = activeEl.parentElement.querySelector('.weight-value');
    if (valueSpan) valueSpan.textContent = parseFloat(weight).toFixed(1);
  }
}

let toastHideTimer = null;
function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  if (toastHideTimer) clearTimeout(toastHideTimer);
  toastHideTimer = setTimeout(function() { toast.classList.remove('show'); }, 2000);
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
